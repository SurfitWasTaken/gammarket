# Paper experiment config: phase6.yaml + the RetailRegime sentiment chain
# (excited_size_mult 3, enter 0.02/min, exit 0.2/min — sweep variant A).
# Used by the mechanism study in research/paper.md: the regime makes
# volatility clustering structural (6/6 seeds in the shipping sweep) at the
# cost of inflating the sample return ACF past the iid band. Everything
# else is identical to sim/config/phase6.yaml.

market:
  tick_size: 1
  lot_size: 100
  initial_price: 10000
  initial_bid_size: 200
  initial_ask_size: 200
  max_steps: 60000
  seed: 42
  vol_window: 20
  minutes_per_year: 525600          # D1: continuous calendar (365×24×60)

agents:
  retail:
    n_agents: 10
    arrival_rate: 10.0
    order_size_mean: 2
    direction_bias: 0.0
    vol_feedback: 0.7      # F8 fallback: order size scales with vol ratio
    regime:                # calm/excited sentiment chain (paper: mechanism study)
      excited_size_mult: 3.0
      enter_rate_per_min: 0.02
      exit_rate_per_min: 0.2
    baseline_vol_bps: 5.0  # vol_ratio denominator (mirrors MM seed)
    vol_ratio_cap: 10.0    # cap on vol_ratio (mirrors F3)

  institution:
    arrival_rate: 5.0
    signal_halflife: 30.0
    signal_sigma: 1.0
    threshold: 0.0
    position_limit: 500
    quote_offset_ticks: 1
    scale: 100
    signal_price_scale: 5

  equity_mms:
    - id: "mm_aggressive"
      arrival_rate: 100.0
      spread_target: 3
      inventory_limit: 2000
      risk_aversion: 0.0005 # F3: near-zero skew gain (integrator drift)
      quote_size: 25        # deep book: hedges fill, no one-sided gaps
      max_orders_per_side: 1
      vol_window: 20
      vol_multiplier: 2.0
      baseline_vol_bps: 5.0
      vol_ratio_cap: 10.0   # F3: caps the bounce-vol spread feedback
      post_only: true       # F3: quotes never cross the BBO

    - id: "mm_conservative"
      arrival_rate: 100.0
      spread_target: 5
      inventory_limit: 2000
      risk_aversion: 0.0005 # F3: near-zero skew gain (integrator drift)
      quote_size: 25        # deep book: hedges fill, no one-sided gaps
      max_orders_per_side: 1
      vol_window: 20
      vol_multiplier: 2.0
      baseline_vol_bps: 5.0
      vol_ratio_cap: 10.0   # F3: caps the bounce-vol spread feedback
      post_only: true       # F3: quotes never cross the BBO

  options_mm:
    arrival_rate: 20.0           # dealer re-hedge checks per minute (E3)
    vol_estimate: 0.20           # annualised σ seed (FlatVolSurface / EWMA)
    spread_vols: 2.0             # bid/ask quoted ± this many vol points (E4)
    delta_hedge_threshold: 0.05  # re-hedge if |net delta| exceeds this (E3)
    gamma_limit: 500             # portfolio gamma cap, lots/tick (E5)
    option_tick: 1               # option quote grid (E4)
    surface_mode: flat           # F6: the validated config; ewma is available
                                 # but the F9 gate was calibrated under flat
                                 # (ewma scored 6/7 per seed — see report)

  options_flow:
    arrival_rate: 5.0            # option trades per minute
    max_lots: 3                  # contracts per trade ~ U[1, max_lots]

options:
  strikes_pct: [-0.10, -0.05, 0.0, 0.05, 0.10]   # F7: widened fixed grid
  expiries_days: [7, 14, 30]
  risk_free_rate: 0.05
